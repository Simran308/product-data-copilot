# Replaces databricks.yml in the agent-openai-agents-sdk template.
# Fill in the three <...> values before `databricks bundle deploy`.
bundle:
  name: product_data_copilot

resources:
  apps:
    product_data_copilot:
      name: "product-data-copilot"
      description: "Multi-step product data quality agent (UC functions + Genie + reviewer + Delta write-back)"
      source_code_path: ./
      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"
          - name: LLM_ENDPOINT
            value: "databricks-qwen3-next-80b-a3b-instruct"
          - name: PRODUCT_SCHEMA
            value: "workspace.product_data"
          - name: GENIE_SPACE_ID
            value: "<genie-space-id>"
          - name: WAREHOUSE_ID
            value: "<sql-warehouse-id>"

      resources:
        - name: 'experiment'
          experiment:
            experiment_id: ""
            permission: 'CAN_MANAGE'
        - name: 'llm-endpoint'
          serving_endpoint:
            name: 'databricks-qwen3-next-80b-a3b-instruct'
            permission: 'CAN_QUERY'
        - name: 'genie'
          genie_space:
            name: 'Product Data Copilot'
            space_id: '<genie-space-id>'
            permission: 'CAN_RUN'
        - name: 'warehouse'
          sql_warehouse:
            id: '<sql-warehouse-id>'
            permission: 'CAN_USE'
        - name: 'fn-health'
          uc_securable:
            securable_full_name: 'workspace.product_data.get_data_quality'
            securable_type: 'FUNCTION'
            permission: 'EXECUTE'
        - name: 'fn-context'
          uc_securable:
            securable_full_name: 'workspace.product_data.get_sku_details'
            securable_type: 'FUNCTION'
            permission: 'EXECUTE'

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: <your-workspace-url>
